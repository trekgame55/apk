name: Build APK + Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Устанавливаем версию
        run: |
          sed -i "s/^version:.*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Устанавливаем зависимости
        run: flutter pub get

      - name: Генерируем иконки
        run: dart run flutter_launcher_icons

      - name: Собираем релизный APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Устанавливаем версию
        shell: bash
        run: |
          sed -i "s/^version:.*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Включаем Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Устанавливаем зависимости
        run: flutter pub get

      - name: Генерируем иконки
        run: dart run flutter_launcher_icons

      - name: Собираем Windows приложение
        run: flutter build windows --release

      - name: Копируем иконку для установщика
        shell: bash
        run: cp windows/runner/resources/app_icon.ico windows/installer/app_icon.ico

      - name: Устанавливаем Inno Setup (если не установлен)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Inno Setup 6 already installed"
          }

      - name: Компилируем установщик
        shell: cmd
        run: |
          "%programfiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=1.0.${{ github.run_number }} windows\installer\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/AgroTehComert-Setup-v1.0.${{ github.run_number }}.exe

  release:
    name: Создать GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-files

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-files

      - name: Переименовываем APK
        run: |
          mv release-files/app-release.apk release-files/AgroTehComert-v1.0.${{ github.run_number }}.apk
          ls -la release-files/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AgroTehComert v1.0.${{ github.run_number }}"
          body: |
            Автоматическая сборка #${{ github.run_number }}

            **Скачать:**
            - 📱 Android — `AgroTehComert-v1.0.${{ github.run_number }}.apk`
            - 🖥️ Windows — `AgroTehComert-Setup-v1.0.${{ github.run_number }}.exe`
          files: |
            release-files/AgroTehComert-v1.0.${{ github.run_number }}.apk
            release-files/AgroTehComert-Setup-v1.0.${{ github.run_number }}.exe
          generate_release_notes: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
