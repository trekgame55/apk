name: Build APK + Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем версию в pubspec.yaml
        shell: bash
        run: |
          sed -i "s/^version:.*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Устанавливаем Java (необходима для Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Устанавливаем Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Устанавливаем зависимости
        run: flutter pub get

      - name: Собираем релизный APK
        run: flutter build apk --release

      - name: Загружаем APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем версию в pubspec.yaml
        shell: bash
        run: |
          sed -i "s/^version:.*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Устанавливаем Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Устанавливаем зависимости
        run: flutter pub get

      - name: Включаем поддержку Windows
        run: flutter config --enable-windows-desktop

      - name: Генерируем иконки
        run: dart run flutter_launcher_icons

      - name: Собираем Windows приложение
        run: flutter build windows --release

      - name: Упаковываем в ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-release.zip

      - name: Загружаем Windows EXE в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: windows-release.zip

  release:
    name: Создать GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Скачиваем APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-files

      - name: Скачиваем Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: ./release-files

      - name: Переименовываем файлы
        run: |
          cd release-files
          mv app-release.apk AgroTehComert-v1.0.${{ github.run_number }}.apk
          mv windows-release.zip AgroTehComert-Windows-v1.0.${{ github.run_number }}.zip
          ls -la

      - name: Создаём GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AgroTehComert v1.0.${{ github.run_number }}"
          body: |
            Автоматическая сборка #${{ github.run_number }}

            **Скачать:**
            - 📱 Android — `AgroTehComert-v1.0.${{ github.run_number }}.apk`
            - 🖥️ Windows — `AgroTehComert-Windows-v1.0.${{ github.run_number }}.zip`
          files: |
            release-files/AgroTehComert-v1.0.${{ github.run_number }}.apk
            release-files/AgroTehComert-Windows-v1.0.${{ github.run_number }}.zip
          generate_release_notes: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
